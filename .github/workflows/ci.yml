name: CI

# Runs on every push/PR to main, and is reported here on GitHub (gh run list,
# the commit's check-run status) so there's an independent, visible record
# of whether a given commit was actually checked. It does NOT by itself
# block a push to main from deploying: commits land directly on main (no PR
# step), so a GitHub-side "required status check" can't gate a push the way
# it gates a PR merge -- a status check can only exist for a commit that's
# already on the remote. The actual gate lives locally: see
# .githooks/pre-push, which runs these same checks (plus
# scripts/ci/logic_tests.py) before `git push` is allowed to proceed at all,
# since pushes from this project only ever happen from a sandbox with that
# hook installed (`git config core.hooksPath .githooks`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HTML structure (single doctype/html/head/body)
        run: python3 scripts/ci/check_html_structure.py

      - name: Check inline <script> syntax
        run: python3 scripts/ci/check_js_syntax.py

      - name: Check data/*.json validity
        run: python3 scripts/ci/check_json.py

      - name: Install Tailwind build tool
        run: npm install

      - name: Verify assets/tailwind.css is in sync with index.html
        run: |
          node scripts/build-tailwind.mjs
          if ! git diff --exit-code assets/tailwind.css; then
            echo ""
            echo "assets/tailwind.css is out of date. Run 'node scripts/build-tailwind.mjs' locally and commit the result."
            exit 1
          fi

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Browser smoke test
        run: python3 scripts/ci/smoke_test.py

      - name: Logic tests (quiz scoring, backup-plan ranking)
        run: python3 scripts/ci/logic_tests.py
